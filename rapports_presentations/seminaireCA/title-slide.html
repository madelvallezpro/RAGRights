<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$ class="quarto-title-block">

  <div style="justify-content: space-between">
  <img src="images/LIFO.png"/>
  <img src="images/Logo Minerve_RVB.jpg" style="width: 375px"/>
  <img src="images/France_2030_Logo_rouge_bleu_transparent.png" style="width: 200px"/>
  </div>
  <p class="title_perso">$title$</p>
  $if(subtitle)$
    <p class="subtitle_perso">$subtitle$</p>
  $endif$
  $if(author)$
    <p class="author_perso">$author$</p>
  $endif$
  $if(date)$
    <p class="date">$date$</p>
  $endif$
</section>
